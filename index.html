<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文案急診室｜完整十五題互動版</title>
<style>
:root{--navy:#17365d;--blue:#2f75b5;--pale:#eef5fb;--green:#4c956c;--yellow:#f2c14e;--red:#c94c4c;--ink:#243447;--muted:#66788a;--white:#fff;--line:#d8e3ee;--shadow:0 12px 32px rgba(23,54,93,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#f8fbff,#edf4fa);color:var(--ink)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 12%,rgba(47,117,181,.10),transparent 25%),radial-gradient(circle at 86% 28%,rgba(76,149,108,.10),transparent 22%);z-index:-1}
header{height:72px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(23,54,93,.05)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--navy);font-size:22px}.logo{width:42px;height:42px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:23px;position:relative}.logo:after{content:"+";position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:6px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:15px;border:2px solid #fff}.nav{display:flex;gap:6px}.nav button{border:0;background:transparent;padding:10px 13px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:var(--pale);color:var(--blue)}
main{max-width:1180px;margin:auto;padding:38px 26px 70px}.page{display:none}.page.active{display:block}.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:40px;align-items:center;min-height:500px}.eyebrow,.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:#e4f0fb;color:var(--blue);font-weight:800}.hero h1{font-size:58px;line-height:1.08;margin:20px 0 18px;color:var(--navy);letter-spacing:-2px}.hero p{font-size:20px;line-height:1.75;color:var(--muted)}.btn{border:0;border-radius:13px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff;box-shadow:0 9px 22px rgba(47,117,181,.25)}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.danger{background:#fff;color:var(--red);border:1px solid #edcaca}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.clinic,.panel,.level,.quiz{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.clinic{padding:28px;border-top:6px solid var(--blue)}.case{background:var(--pale);border-radius:18px;padding:22px;margin-bottom:16px}.case h3{margin:8px 0;color:var(--navy)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}.stat b{display:block;font-size:24px;color:var(--blue)}.stat span{font-size:13px;color:var(--muted);font-weight:700}
.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;padding-bottom:17px;border-bottom:1px solid var(--line)}.section-title h2{font-size:34px;color:var(--navy);margin:0}.section-title p{margin:6px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.level{padding:24px;position:relative;overflow:hidden}.level .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;background:var(--blue)}.level:nth-child(2) .num{background:var(--green)}.level:nth-child(3) .num{background:#c99200}.level h3{font-size:22px;color:var(--navy);margin:18px 0 8px}.level p{color:var(--muted);line-height:1.6;min-height:52px}.progress{height:9px;background:#e7edf3;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#61a5db)}.meta{display:flex;justify-content:space-between;font-size:13px;margin:10px 0 18px;color:var(--muted)}
.quiz-wrap{display:grid;grid-template-columns:245px 1fr;gap:26px}.side{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;height:max-content;position:sticky;top:95px}.side h3{margin:0 0 15px;color:var(--navy)}.step{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;margin:4px 0;color:var(--muted);font-weight:700;cursor:pointer}.step.current{background:var(--pale);color:var(--blue)}.step.done{color:var(--green)}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7edf3;font-size:13px}.current .dot{background:var(--blue);color:#fff}.done .dot{background:var(--green);color:#fff}.quiz{padding:30px;position:relative}.quiz-top{display:flex;justify-content:space-between;color:var(--muted);font-weight:700}.scenario{background:#f7f9fc;border-left:5px solid var(--yellow);padding:17px 18px;border-radius:10px;margin:24px 0}.quiz h2{font-size:27px;color:var(--navy);line-height:1.4}.option{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:11px 0;cursor:pointer;background:#fff}.option:hover{border-color:var(--blue);transform:translateX(3px)}.option.selected{border:2px solid var(--blue);background:#eef6fd}.option.correct{border:2px solid var(--green);background:#eef8f1}.option.wrong{border:2px solid var(--red);background:#fff4f4}.letter{min-width:30px;height:30px;border-radius:9px;background:#edf2f7;display:grid;place-items:center;font-weight:900;color:var(--navy)}.selected .letter{background:var(--blue);color:#fff}.correct .letter{background:var(--green);color:#fff}.wrong .letter{background:var(--red);color:#fff}.quiz-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}.hint-buttons{display:flex;gap:8px}.feedback,.hintbox{display:none;margin-top:17px;padding:16px 18px;border-radius:13px;line-height:1.6}.feedback.show,.hintbox.show{display:block}.feedback.good{background:#eef8f1;border:1px solid #bddcc8;color:#255c39}.feedback.bad{background:#fff4f4;border:1px solid #e8c1c1;color:#853333}.hintbox{background:#fff8df;border:1px solid #ead688;color:#765a00}.feedback b,.hintbox b{display:block;margin-bottom:4px}
.sort-list{display:grid;gap:10px}.sort-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.sort-controls{margin-left:auto;display:flex;gap:6px}.mini{border:1px solid var(--line);background:#f7f9fc;border-radius:8px;padding:6px 9px;cursor:pointer}.class-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.class-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafcff}.class-card h4{margin:0 0 10px;color:var(--navy)}.class-card select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{padding:24px}.panel h3{margin-top:0;color:var(--navy)}.bar{display:grid;grid-template-columns:115px 1fr 48px;gap:12px;align-items:center;margin:15px 0}.barline{height:10px;border-radius:999px;background:#e8edf2}.barline span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#61a5db)}.summary-score{font-size:58px;font-weight:900;color:var(--blue)}.muted{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}.footer-note{margin-top:42px;padding:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
@media(max-width:820px){header{padding:0 16px}.nav button{padding:8px}.nav button span{display:none}main{padding:24px 16px}.hero{grid-template-columns:1fr}.hero h1{font-size:42px}.cards,.report-grid{grid-template-columns:1fr}.quiz-wrap{grid-template-columns:1fr}.side{position:static}.class-grid{grid-template-columns:1fr}.section-title{align-items:flex-start;gap:15px}.footer-note{display:block}.footer-note span{display:block;margin:4px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body>
<header><div class="brand"><div class="logo">文</div>文案急診室</div><nav class="nav"><button class="active" data-page="home" onclick="showPage('home',this)">首頁</button><button data-page="levels" onclick="showPage('levels',this)">關卡</button><button data-page="quiz" onclick="openCurrent()">作答</button><button data-page="report" onclick="showReport(this)">報告</button></nav></header>
<main>
<section id="home" class="page active"><div class="hero"><div><span class="eyebrow">✦ 自主學習網頁遊戲</span><h1>看懂問題，<br>救回每一份文案。</h1><p>從受眾、訊息、語氣到可信度，完成三間診療室的十五項任務。每一題都有分層提示，可不限次數反覆練習。</p><div class="actions"><button class="btn primary" onclick="showPage('levels')">開始診療</button><button class="btn secondary" onclick="resetAll()">重新建立紀錄</button></div></div><div class="clinic"><div class="case"><small>病例檔案</small><h3>三間診療室，十五項判讀任務</h3><div class="chips"><span class="chip">受眾洞察</span><span class="chip">訊息組織</span><span class="chip">內容可信</span><span class="chip">行動設計</span></div></div><div class="status"><div class="stat"><b>3</b><span>學習關卡</span></div><div class="stat"><b>15</b><span>互動題目</span></div><div class="stat"><b>80</b><span>通過分數</span></div></div></div></div></section>
<section id="levels" class="page"><div class="section-title"><div><h2>關卡地圖</h2><p>三關皆可直接進入；每關五題，滿分一百分。</p></div><span class="badge" id="saveBadge">進度已保存在瀏覽器</span></div><div class="cards" id="levelCards"></div></section>
<section id="quiz" class="page"><div class="quiz-wrap"><aside class="side"><h3 id="sideTitle"></h3><div id="steps"></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="showPage('levels')">返回關卡地圖</button></aside><div class="quiz"><div class="quiz-top"><span id="qCounter"></span><span id="scoreNow"></span></div><div class="scenario" id="scenario"></div><h2 id="questionText"></h2><div id="answerArea"></div><div id="hintBox" class="hintbox"></div><div id="feedback" class="feedback"></div><div class="quiz-actions"><div class="hint-buttons"><button class="btn secondary" onclick="showHint(1)">提示一</button><button class="btn secondary" onclick="showHint(2)">提示二</button></div><div><button class="btn primary" id="submitBtn" onclick="submitAnswer()">確認答案</button> <button class="btn secondary" id="nextBtn" onclick="nextQuestion()" style="display:none">下一題</button></div></div></div></div></section>
<section id="report" class="page"><div class="section-title"><div><h2>個人學習報告</h2><p id="reportMeta"></p></div><div><button class="btn primary" onclick="downloadCSV()">下載 CSV</button> <button class="btn danger" onclick="resetAll()">清除紀錄</button></div></div><div id="reportContent"></div></section>
<div class="footer-note"><span><b>文案急診室</b>｜完整十五題互動版</span><span>不蒐集姓名，資料僅保存在目前瀏覽器</span></div>
</main>
<script>
const Q=[
{id:'L1Q01',level:1,type:'single',scene:'校園設計展即將開幕，主辦單位希望提高非設計系學生的參觀人數。',q:'下列哪一個最適合作為主要目標受眾？',o:['已參展的設計系學生','可能對展覽有興趣但尚未決定參觀的非設計系學生','負責採購展板的行政人員','參展學生的授課教師'],a:[1],h1:'先找出文案希望誰採取參觀行動。',h2:'題目強調提高非設計系學生的參觀人數。',x:'主要受眾是尚未決定是否參觀的非設計系學生，文案應降低理解門檻並說明參觀價值。',skill:'受眾洞察'},
{id:'L1Q02',level:1,type:'single',scene:'學校推出夜間自習空間，使用者必須先完成線上預約。',q:'哪一個溝通目標最精確？',o:['介紹校園所有建築','讓學生知道夜間自習空間很漂亮','促使有夜間讀書需求的學生完成預約','提醒教師準時下班'],a:[2],h1:'溝通目標要能描述讀者看完後的具體行動。',h2:'找出文案最希望讀者完成的下一步。',x:'有效目標應包含特定受眾與可觀察行動，此處為有需求的學生完成線上預約。',skill:'行動設計'},
{id:'L1Q03',level:1,type:'single',scene:'地方農場想邀請親子家庭參加週末採收體驗。',q:'哪一種語氣最適合？',o:['本公司依相關規定辦理採收作業，敬請查照','週末帶孩子走進田裡，親手採下當季蔬菜，一起認識食物從哪裡來','錯過這次活動，孩子將永遠失去接觸自然的機會','專業農業生產流程與供應鏈管理研討會正式召開'],a:[1],h1:'語氣要同時符合親子家庭與體驗活動。',h2:'避免公文語氣、恐嚇式說法及過度專業術語。',x:'第二個選項具體描繪親子共同參與的情境，也清楚連結活動價值。',skill:'語氣控制'},
{id:'L1Q04',level:1,type:'single',scene:'學生社團招募新成員，希望吸引沒有相關經驗、但願意嘗試的人。',q:'哪一個標題最符合受眾需求？',o:['第十八屆社團組織章程公告','高手限定，不夠專業請勿報名','第一次也沒關係，從一場體驗開始加入我們','本社團歷屆幹部名單彙整'],a:[2],h1:'受眾最擔心的是缺乏經驗。',h2:'標題應降低參與門檻並提供明確起點。',x:'第三個選項直接回應新手疑慮，並用體驗作為低門檻行動。',skill:'受眾洞察'},
{id:'L1Q05',level:1,type:'multi',scene:'校園餐廳推動自備餐盒折價，希望增加實際使用人數。',q:'下列哪些資訊應優先出現在文案中？可複選。',o:['折價金額','適用店家','餐廳成立年份','如何取得折扣','校長致詞全文'],a:[0,1,3],h1:'優先保留會影響讀者判斷及行動的資訊。',h2:'思考讀者需要知道多少優惠、在哪裡用、怎麼用。',x:'折價金額、適用店家及使用方法會直接影響參與；成立年份與致詞不必放在主要文案。',skill:'訊息組織'},
{id:'L2Q01',level:2,type:'single',scene:'原文：本活動內容豐富多元，精彩可期，保證讓每一位參加者都獲得前所未有的完美體驗。',q:'最主要的問題是什麼？',o:['資訊過度具體','使用無法證明的誇大承諾','受眾稱謂過多','行動方式太詳細'],a:[1],h1:'注意保證、每一位、完美等絕對性用語。',h2:'文案沒有證據支持對所有參加者的結果承諾。',x:'用絕對語句保證體驗，容易降低可信度；應改為具體說明活動內容及可能收穫。',skill:'內容可信'},
{id:'L2Q02',level:2,type:'single',scene:'原文：我們準備了講座、展覽、工作坊、導覽、交流、抽獎、餐點與紀念品。活動日期是十二月十日。名額有限，請於十二月一日前報名。',q:'若目標是促使讀者報名，最應優先修正什麼？',o:['刪除所有活動內容','把報名期限與報名方式提到更明顯的位置','增加更多形容詞','把日期改成英文'],a:[1],h1:'讀者需要迅速找到下一步。',h2:'行動相關資訊不應埋在長串內容之後。',x:'應強化資訊層級，把截止日期、名額與報名入口集中呈現，降低行動阻力。',skill:'行動設計'},
{id:'L2Q03',level:2,type:'single',scene:'標題：五分鐘完成校園借書。內文：請先下載表格、列印簽名，再於上班時間送到三個不同單位核章。',q:'這段文案的核心問題是什麼？',o:['標題與實際流程不一致','內文沒有標點','受眾過度明確','內容太短'],a:[0],h1:'比較標題承諾與內文描述的實際成本。',h2:'五分鐘完成與多步驟紙本核章互相矛盾。',x:'標題承諾快速完成，但內文顯示流程繁複，會損害可信度；應修改標題或簡化流程。',skill:'文案診斷'},
{id:'L2Q04',level:2,type:'multi',scene:'原文：根據研究，使用本方法可提升百分之八十的創造力，而且所有學生都會明顯進步。',q:'哪些內容必須查證？可複選。',o:['研究來源','百分之八十的計算方式','所有學生都會進步的依據','句子使用的字型','段落背景顏色'],a:[0,1,2],h1:'涉及研究、數字及普遍性結論時應查證。',h2:'找出可被驗證、也可能誤導讀者的主張。',x:'研究來源、數字的定義及全體學生皆進步的依據都必須確認。',skill:'內容可信'},
{id:'L2Q05',level:2,type:'single',scene:'原文：親愛的各位使用者您好，鑑於本系統相關功能目前處於階段性調整狀態，因此可能會有部分服務出現暫時無法正常使用之情形。',q:'哪一個改寫最清楚？',o:['系統有事，請大家注意','系統將於今晚九點至十點維護，期間無法登入，請提前完成操作','相關功能處於狀態，敬請配合辦理','為提升品質，本系統在適當時間進行必要處置'],a:[1],h1:'清楚文案需要具體時間、影響與讀者行動。',h2:'刪除抽象套語，直接說明何時、影響什麼、要怎麼準備。',x:'第二個選項提供維護時段、影響範圍與預先操作建議，資訊最完整。',skill:'訊息組織'},
{id:'L3Q01',level:3,type:'classify',scene:'校園永續市集宣傳，需從資訊中挑選首頁核心內容。',q:'請為每一項資訊選擇最適合的分類。',o:['十二月十二日中午舉行','地點在中央廣場','攜帶環保杯可換折價券','籌備會議共開了七次','全校最環保的活動','雨天改至體育館','主辦單位歷年名單','每人都能省下一百元'],a:['核心訊息','核心訊息','核心訊息','可以刪除','必須查證','輔助資訊','可以刪除','必須查證'],h1:'先保留時間、地點、參與誘因及必要備案。',h2:'絕對性評價與節省金額需要證據，內部籌備資訊可刪除。',x:'核心資訊支持到場及參與；雨備屬重要輔助；無關過程可刪；比較性與量化主張需查證。',skill:'訊息組織'},
{id:'L3Q02',level:3,type:'sort',scene:'新生工作坊即將開放報名。',q:'請把四項資訊拖成最適合的呈現順序，或使用上下按鈕調整。',o:['活動價值','適合對象','時間地點','報名方式與期限'],a:['活動價值','適合對象','時間地點','報名方式與期限'],h1:'先回答為什麼值得參加，再降低讀者的決策與行動成本。',h2:'首頁文案通常依價值、對象、關鍵條件、行動入口排列。',x:'先建立參與理由，再確認適用性與條件，最後引導讀者完成報名。',skill:'訊息組織'},
{id:'L3Q03',level:3,type:'multi',scene:'地方店家要宣傳以當季農產製作的新餐點。',q:'哪些資料可提升可信度？可複選。',o:['農產來源地與合作農場','實際使用的當季食材','沒有來源的全臺第一宣稱','餐點供應期間','保證所有人都喜歡'],a:[0,1,3],h1:'可信資訊應具體、可查核，並與購買決策有關。',h2:'來源、食材與供應期間都能被確認。',x:'具體產地、食材及期間能建立可信度；全臺第一與所有人都喜歡屬無證據的誇大主張。',skill:'內容可信'},
{id:'L3Q04',level:3,type:'single',scene:'校園講座的資訊很多，但社群貼文首圖只能放一句話。活動主題是辨識網路假消息，對象是大一新生。',q:'哪一句最適合作為核心訊息？',o:['本校學務處舉辦多元知能系列活動','三個判斷步驟，幫你在轉傳前看出可疑訊息','講師曾參與多場會議並累積豐富經驗','活動場地備有一百二十張座椅'],a:[1],h1:'核心訊息應連結受眾需求與明確收穫。',h2:'大一新生最需要知道參加後能學會什麼。',x:'第二個選項以具體方法與使用情境呈現學習價值，最適合做首要訊息。',skill:'受眾洞察'},
{id:'L3Q05',level:3,type:'classify',scene:'學生要為公共自行車安全宣導整理素材。',q:'請為每一項素材選擇最適合的分類。',o:['騎乘前檢查煞車與輪胎','夜間開啟車燈並提高可見度','服務啟用年份','事故率可降低百分之九十','常見錯誤示範','歷屆宣導海報數量','遵守號誌與行車方向','安全帽選購連結'],a:['核心訊息','核心訊息','可以刪除','必須查證','輔助資訊','可以刪除','核心訊息','輔助資訊'],h1:'安全宣導的核心應是可立即執行的行為。',h2:'量化成效需要來源，歷史與產出數量不影響安全行動。',x:'核心內容直接支持安全騎乘；錯誤示範與延伸資源可輔助理解；無關歷史可刪除；事故率需查證。',skill:'行動設計'}];
const names=['受眾偵查室','文案診斷室','資訊搶救室'];
const key='copyClinicV1';
let storageEnabled=true;
const memoryStore={};
function storageGet(k){try{return window.localStorage.getItem(k)}catch(e){storageEnabled=false;return memoryStore[k]||null}}
function storageSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){storageEnabled=false;memoryStore[k]=v}}
function storageRemove(k){try{window.localStorage.removeItem(k)}catch(e){storageEnabled=false;delete memoryStore[k]}}
function createState(){return{id:'VD-'+Math.random().toString(36).slice(2,7).toUpperCase(),answers:{},hints:{},started:new Date().toISOString(),current:'L1Q01'}}
let state;
try{state=JSON.parse(storageGet(key)||'null')||createState()}catch(e){state=createState()}
let current=Q.find(x=>x.id===state.current)||Q[0];let draft=[];
function save(){storageSet(key,JSON.stringify(state));let badge=document.getElementById('saveBadge');if(badge)badge.textContent=storageEnabled?'進度已保存在瀏覽器':'目前為預覽模式，進度僅保留到關閉頁面'}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='levels')renderLevels();window.scrollTo(0,0)}
function levelQuestions(l){return Q.filter(x=>x.level===l)}
function levelScore(l){let arr=levelQuestions(l),sum=0;arr.forEach(q=>sum+=state.answers[q.id]?.score||0);return sum}
function levelDone(l){return levelQuestions(l).filter(q=>state.answers[q.id]).length}
function renderLevels(){let el=document.getElementById('levelCards');el.innerHTML='';[1,2,3].forEach(l=>{let done=levelDone(l),score=levelScore(l);el.innerHTML+=`<article class="level"><div class="num">0${l}</div><h3>${names[l-1]}</h3><p>${l===1?'辨識目標讀者、需求、阻礙與期待行動。':l===2?'找出誇大承諾、資訊失焦與標題矛盾。':'取捨資訊、建立層級，辨識需要查證的主張。'}</p><div class="progress"><span style="width:${done*20}%"></span></div><div class="meta"><span>完成 ${done}／5</span><b>${score} 分</b></div><button class="btn primary" style="width:100%" onclick="startLevel(${l})">${done===5?'重新檢視':'進入關卡'}</button></article>`})}
function startLevel(l){current=levelQuestions(l).find(q=>!state.answers[q.id])||levelQuestions(l)[0];state.current=current.id;save();renderQuestion();showPage('quiz')}
function openCurrent(){current=Q.find(x=>x.id===state.current)||Q[0];renderQuestion();showPage('quiz')}
function renderQuestion(){draft=[];document.getElementById('sideTitle').textContent=names[current.level-1];document.getElementById('qCounter').textContent=`題目 ${Q.indexOf(current)%5+1}／5`;document.getElementById('scoreNow').textContent=`本關 ${levelScore(current.level)} 分`;document.getElementById('scenario').innerHTML=`<b>情境</b><br>${current.scene}`;document.getElementById('questionText').textContent=current.q;document.getElementById('hintBox').className='hintbox';document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('submitBtn').style.display='inline-block';document.getElementById('nextBtn').style.display='none';renderSteps();renderAnswer();let old=state.answers[current.id];if(old){draft=old.value;showResult(old.correct,false)}}
function renderSteps(){let el=document.getElementById('steps');el.innerHTML='';levelQuestions(current.level).forEach((q,i)=>{let cls=q.id===current.id?'current':state.answers[q.id]?'done':'';el.innerHTML+=`<div class="step ${cls}" onclick="jump('${q.id}')"><span class="dot">${state.answers[q.id]?'✓':i+1}</span>第${['一','二','三','四','五'][i]}題</div>`})}
function jump(id){current=Q.find(x=>x.id===id);state.current=id;save();renderQuestion()}
function renderAnswer(){let el=document.getElementById('answerArea');if(current.type==='single'||current.type==='multi'){el.innerHTML=current.o.map((t,i)=>`<div class="option" onclick="pick(${i},this)"><span class="letter">${String.fromCharCode(65+i)}</span><span>${t}</span></div>`).join('')}else if(current.type==='classify'){let cats=['核心訊息','輔助資訊','可以刪除','必須查證'];el.innerHTML='<div class="class-grid">'+current.o.map((t,i)=>`<div class="class-card"><h4>${i+1}. ${t}</h4><select onchange="classPick(${i},this.value)"><option value="">請選擇分類</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')+'</div>'}else{draft=[...current.o];renderSort()}}
function pick(i,el){if(current.type==='single'){draft=[i];document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}else{draft.includes(i)?draft=draft.filter(x=>x!==i):draft.push(i);el.classList.toggle('selected')}}
function classPick(i,v){draft[i]=v}
function renderSort(){document.getElementById('answerArea').innerHTML='<div class="sort-list">'+draft.map((t,i)=>`<div class="sort-item"><span class="letter">${i+1}</span><b>${t}</b><div class="sort-controls"><button class="mini" onclick="move(${i},-1)">↑</button><button class="mini" onclick="move(${i},1)">↓</button></div></div>`).join('')+'</div>'}
function move(i,d){let j=i+d;if(j<0||j>=draft.length)return;[draft[i],draft[j]]=[draft[j],draft[i]];renderSort()}
function showHint(n){let el=document.getElementById('hintBox');el.className='hintbox show';el.innerHTML=`<b>提示${n===1?'一':'二'}</b>${n===1?current.h1:current.h2}`;state.hints[current.id]=Math.max(state.hints[current.id]||0,n);save()}
function equal(a,b){return JSON.stringify([...a].sort())===JSON.stringify([...b].sort())}
function submitAnswer(){if(!draft.length||current.type==='classify'&&draft.filter(Boolean).length!==current.o.length){alert('請先完成所有作答內容。');return}let correct=current.type==='sort'||current.type==='classify'?JSON.stringify(draft)===JSON.stringify(current.a):equal(draft,current.a);let hint=state.hints[current.id]||0;let score=correct?20-(hint===1?2:hint===2?5:0):0;state.answers[current.id]={value:[...draft],correct,score,time:new Date().toISOString(),skill:current.skill};save();showResult(correct,true)}
function showResult(correct,mark){let f=document.getElementById('feedback');f.className='feedback show '+(correct?'good':'bad');f.innerHTML=`<b>${correct?'診斷正確':'需要再判讀'}</b>${correct?current.x:'請參考提示，再檢查受眾、目的、資訊層級與可信度。你可以重新選擇後再次送出。'}`;if(mark&&correct){document.getElementById('submitBtn').style.display='none';document.getElementById('nextBtn').style.display='inline-block'}renderSteps();document.getElementById('scoreNow').textContent=`本關 ${levelScore(current.level)} 分`}
function nextQuestion(){let arr=levelQuestions(current.level),i=arr.findIndex(x=>x.id===current.id);if(i<4){current=arr[i+1];state.current=current.id;save();renderQuestion()}else{showReport();}}
function showReport(btn){showPage('report',btn);let completed=Object.keys(state.answers).length,total=Object.values(state.answers).reduce((s,a)=>s+a.score,0);document.getElementById('reportMeta').textContent=`匿名代碼 ${state.id}｜已完成 ${completed}／15 題`;let skills={};Q.forEach(q=>{skills[q.skill]=skills[q.skill]||{got:0,max:0};skills[q.skill].max+=20;skills[q.skill].got+=state.answers[q.id]?.score||0});let skillHtml=Object.entries(skills).map(([k,v])=>{let p=Math.round(v.got/v.max*100);return `<div class="bar"><span>${k}</span><div class="barline"><span style="width:${p}%"></span></div><b>${p}</b></div>`}).join('');document.getElementById('reportContent').innerHTML=`<div class="report-grid"><div class="panel"><h3>整體完成狀況</h3><div class="summary-score">${total}<small style="font-size:18px">／300</small></div><p class="muted">提示一扣二分，提示二累計扣五分；答錯可重新作答。</p>${[1,2,3].map(l=>`<div class="bar"><span>${names[l-1]}</span><div class="barline"><span style="width:${levelScore(l)}%"></span></div><b>${levelScore(l)}</b></div>`).join('')}</div><div class="panel"><h3>能力概況</h3>${skillHtml}</div></div>`}
function downloadCSV(){let rows=[['匿名代碼','題號','關卡','題型','能力','是否正確','得分','提示層級','完成時間']];Q.forEach(q=>{let a=state.answers[q.id];if(a)rows.push([state.id,q.id,names[q.level-1],q.type,q.skill,a.correct?'是':'否',a.score,state.hints[q.id]||0,a.time])});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`文案急診室_${state.id}_學習紀錄.csv`;a.click();URL.revokeObjectURL(url)}
function resetAll(){if(!confirm('確定要清除全部作答紀錄嗎？此操作無法復原。'))return;storageRemove(key);location.reload()}
renderLevels();save();if(!storageEnabled){let p=document.querySelector('#home .hero p');if(p)p.insertAdjacentHTML('afterend','<div style="margin-top:14px;padding:12px 14px;border:1px solid #ead688;background:#fff8df;border-radius:12px;color:#765a00;font-weight:700">目前由檔案預覽器開啟，瀏覽器禁止永久儲存。作答功能仍可使用，但關閉頁面後進度可能消失。請下載檔案後用 Chrome 或 Edge 開啟，或部署到 GitHub Pages。</div>');}
</script></body></html>
