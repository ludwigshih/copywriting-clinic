<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文案急診室｜第一單元</title><link rel="stylesheet" href="style.css"></head><body>
<div id="codeModal" class="modal show"><div class="modal-box"><h2>設定診療代號</h2><p class="muted">接下來會以 Dr.代號 稱呼您。請勿輸入姓名或學號。</p><div class="code"><span>Dr.</span><input id="codeInput" maxlength="16" placeholder="例如：文案高手"></div><div id="codeError" style="color:var(--red);font-weight:800;min-height:22px"></div><button class="btn primary" style="width:100%" onclick="setCode()">進入第一單元</button></div></div>
<header><div class="brand">✚ 文案急診室</div><div class="doctor" id="doctorLabel">Dr.尚未設定</div></header>
<main>
<section id="home" class="page active"><div class="hero"><b style="color:var(--blue)">第一單元</b><h1>從議題到一句話</h1><p>先辨識主題、議題與核心主張，再練習資訊取捨、句子順序及智慧組句。完成十二題後，進入「把一項議題縮成一句話」實作。</p><div class="stats"><div class="stat"><b>12</b>互動題</div><div class="stat"><b>1</b>智慧填空實作</div><div class="stat"><b>80</b>通過分數</div></div><div class="progress-wrap"><div class="progress"><span id="homeProgress" style="width:0"></span></div><p id="homeProgressText" class="muted">尚未開始</p></div><div class="actions"><button class="btn primary" onclick="startQuiz()">開始／繼續答題</button><button class="btn secondary" onclick="showPage('practice')">進入單元實作</button><button class="btn secondary" onclick="showReport()">查看學習報告</button></div></div></section>
<section id="quiz" class="page"><div class="layout"><aside class="side"><h3>十二題進度</h3><div id="steps"></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="showPage('home')">返回首頁</button></aside><div class="card"><div class="muted" id="qMeta"></div><div class="scenario" id="scenario"></div><h2 class="question" id="questionText"></h2><div id="options"></div><div id="hintBox" class="hint"></div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn secondary" onclick="showHint(1)">提示一</button><button class="btn secondary" onclick="showHint(2)">提示二</button><button id="submitBtn" class="btn primary" onclick="submitAnswer()">確認答案</button><button id="nextBtn" class="btn green" style="display:none" onclick="nextQuestion()">下一題</button></div></div></div></section>
<section id="practice" class="page"><div class="card"><h1 style="color:var(--navy)">單元實作｜把一項議題縮成一句話</h1><div class="scenario"><b>任務資料</b><br><span id="practiceSource"></span></div><p class="muted">每個欄位先選句型，再選詞語積木。只要內容完整、句型正確且語氣自然，就能得分，沒有唯一答案。</p><div id="practiceFields"></div><div class="actions"><button class="btn green" onclick="finishPractice()">完成實作</button><button class="btn secondary" onclick="showPage('home')">返回首頁</button></div></div></section>
<section id="report" class="page"><div class="card"><h1 style="color:var(--navy)">第一單元學習報告</h1><p id="reportMeta" class="muted"></p><div id="reportContent" class="report-grid"></div><div class="actions"><button class="btn primary" onclick="downloadJSON()">下載進度 JSON</button><button class="btn secondary" onclick="jsonInput.click()">載入進度 JSON</button><input id="jsonInput" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"><button class="btn secondary" onclick="downloadCSV()">下載教師用 CSV</button><button class="btn danger" onclick="resetAll()">清除紀錄</button></div></div></section>
</main><script src="app.js"></script></body></html>
